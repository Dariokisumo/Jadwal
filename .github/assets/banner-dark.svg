<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" fill="none">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="800" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1612"/>
      <stop offset="100%" stop-color="#120F0D"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0A830" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F0A830" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F0A830" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background surface -->
  <rect width="800" height="240" rx="16" fill="url(#bgDark)"/>
  <rect width="798" height="238" x="1" y="1" rx="15" stroke="#332B24" stroke-width="1"/>

  <!-- Period Rhythm Geometry Scaffolding (Abstract schedule timeline) -->
  <g opacity="0.35" transform="translate(60, 48)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#403A33" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="3" fill="#665F56"/>
    <circle cx="170" cy="0" r="3" fill="#665F56"/>
    <circle cx="340" cy="0" r="4" fill="#F0A830"/>
    <circle cx="510" cy="0" r="3" fill="#665F56"/>
    <circle cx="680" cy="0" r="3" fill="#665F56"/>
  </g>

  <!-- Golden Status Horizon Line -->
  <rect x="360" y="47" width="80" height="2" rx="1" fill="url(#accentGlow)"/>

  <!-- Brand Glyph (Minimalist Bell/Timeline Chronometer) -->
  <g transform="translate(400, 84)">
    <circle cx="0" cy="0" r="18" fill="#292219" stroke="#F0A830" stroke-width="1.5"/>
    <!-- Clock/Schedule Hands -->
    <path d="M0 -10 V0 H7" stroke="#F0A830" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="#F5F2EB"/>
  </g>

  <!-- Typography -->
  <text x="400" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#F5F2EB">JADWAL</text>
  <text x="400" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#F0A830">THE QUIET COMPANION</text>
  <text x="400" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#A8A196">Offline timetable tracker with live period status &amp; local bell alerts for teachers</text>

  <!-- Metadata Badges -->
  <g transform="translate(400, 206)">
    <!-- Pill 1 -->
    <rect x="-174" y="-11" width="76" height="22" rx="11" fill="#231F1A" stroke="#3D362E" stroke-width="1"/>
    <text x="-136" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.5" fill="#D6CFC5">OFFLINE</text>

    <!-- Pill 2 -->
    <rect x="-88" y="-11" width="76" height="22" rx="11" fill="#231F1A" stroke="#3D362E" stroke-width="1"/>
    <text x="-50" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.5" fill="#D6CFC5">PRIVATE</text>

    <!-- Pill 3 -->
    <rect x="-2" y="-11" width="86" height="22" rx="11" fill="#231F1A" stroke="#3D362E" stroke-width="1"/>
    <text x="41" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.5" fill="#D6CFC5">M3 · GEIST</text>

    <!-- Pill 4 -->
    <rect x="94" y="-11" width="80" height="22" rx="11" fill="#231F1A" stroke="#3D362E" stroke-width="1"/>
    <text x="134" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="0.5" fill="#F0A830">v2.10.3</text>
  </g>
</svg>
